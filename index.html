<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>채널 꾸미기 에디터</title>
<style>
  :root{
    --bg:#fff; --text:#0f0f0f; --sub:#606060; --line:#e5e5e5; --pill:#f2f2f2; --accent:#065fd4;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  @media(prefers-color-scheme:dark){
    :root:not([data-theme="light"]){--bg:#0f0f0f;--text:#f1f1f1;--sub:#aaa;--line:#303030;--pill:#272727;}
  }
  :root[data-theme="dark"]{--bg:#0f0f0f;--text:#f1f1f1;--sub:#aaa;--line:#303030;--pill:#272727;}
  *{box-sizing:border-box;}
  html{scroll-padding-top:env(safe-area-inset-top,0px);}
  body{margin:0;background:var(--bg);color:var(--text);font-family:"Noto Sans KR","Roboto",Arial,sans-serif;}

  /* topbar */
  .topbar{display:flex;align-items:center;gap:16px;padding:10px 16px;border-bottom:1px solid var(--line);}
  .searchbox{flex:1;max-width:600px;display:flex;align-items:center;border:1px solid var(--line);border-radius:20px;overflow:hidden;}
  .searchbox input{flex:1;border:none;background:transparent;color:var(--text);padding:8px 14px;outline:none;font-size:14px;}
  .searchbox button{border:none;background:var(--pill);padding:8px 18px;cursor:default;color:var(--text);}
  .pill-btn{border:1px solid var(--line);background:transparent;color:var(--text);border-radius:18px;padding:7px 14px;font-size:13px;white-space:nowrap;}
  .spacer{flex:1;}

  /* banner */
  .banner-wrap{
    position:relative;width:100%;aspect-ratio:2560/423;
    background:var(--pill);border-bottom:1px solid var(--line);
    overflow:hidden;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
  }
  .banner-wrap img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none;}
  .banner-wrap img.has-img{display:block;}
  .banner-empty{display:flex;flex-direction:column;align-items:center;gap:8px;color:var(--sub);font-size:14px;pointer-events:none;text-align:center;}
  .banner-empty .icon{font-size:32px;opacity:.5;}
  .banner-empty small{font-size:12px;opacity:.7;}
  .banner-overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:6px;color:#fff;background:rgba(0,0,0,.3);font-size:14px;opacity:0;transition:opacity .15s;pointer-events:none;text-align:center;}
  .banner-overlay small{opacity:.85;font-size:12px;}
  .banner-wrap:not(.has-banner) .banner-empty{opacity:1;}
  .banner-wrap.has-banner .banner-empty{display:none;}
  .banner-wrap.has-banner:hover .banner-overlay{opacity:1;}
  .banner-wrap:not(.has-banner):hover .banner-overlay{opacity:1;}

  .content{max-width:1400px;margin:0 auto;padding:0 24px;}

  /* channel head */
  .channel-head{display:flex;gap:24px;align-items:flex-start;padding:20px 0 16px;flex-wrap:wrap;}
  .avatar-wrap{position:relative;width:138px;height:138px;border-radius:50%;flex:0 0 auto;cursor:pointer;background:var(--pill);overflow:hidden;border:1px solid var(--line);}
  .avatar-wrap img{width:100%;height:100%;object-fit:cover;display:none;}
  .avatar-wrap img.has-img{display:block;}
  .avatar-placeholder{width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:var(--sub);font-size:12px;text-align:center;padding:8px;}
  .avatar-wrap img.has-img ~ .avatar-placeholder{display:none;}
  .avatar-hint{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;background:rgba(0,0,0,.35);font-size:12px;opacity:0;transition:opacity .15s;text-align:center;}
  .avatar-wrap:hover .avatar-hint{opacity:1;}

  .meta{flex:1;min-width:260px;padding-top:4px;}
  .name-row{display:flex;align-items:center;gap:6px;}
  .name-input{font-size:28px;font-weight:800;border:none;background:transparent;color:var(--text);padding:2px 4px;border-radius:6px;min-width:120px;}
  .name-input:hover,.name-input:focus{background:var(--pill);outline:none;}
  .verify{width:18px;height:18px;flex:0 0 auto;color:var(--sub);}

  .subline{display:flex;align-items:center;gap:6px;color:var(--sub);font-size:14px;margin-top:4px;flex-wrap:wrap;}
  .handle-input{border:none;background:transparent;color:var(--sub);font-size:14px;padding:1px 3px;border-radius:4px;width:120px;}
  .handle-input:hover,.handle-input:focus{background:var(--pill);outline:none;}
  .subs-input{border:none;background:transparent;color:var(--sub);font-size:14px;padding:1px 3px;border-radius:4px;width:80px;}
  .subs-input:hover,.subs-input:focus{background:var(--pill);outline:none;}
  .dot{opacity:.6;}

  /* desc */
  .desc-block{margin-top:10px;max-width:700px;}
  .desc-line{display:flex;align-items:center;gap:6px;padding:3px 4px;border-radius:6px;min-height:28px;cursor:text;}
  .desc-line:hover{background:var(--pill);}
  .desc-line .line-text{flex:1;font-size:14px;color:var(--text);line-height:1.5;white-space:pre-wrap;word-break:break-all;}
  .desc-line .line-text .tag{color:var(--accent);font-weight:500;}
  .desc-line .line-input{flex:1;border:none;background:transparent;color:var(--text);font-size:14px;font-family:inherit;padding:0;outline:none;display:none;}
  .desc-line.editing .line-text{display:none;}
  .desc-line.editing .line-input{display:block;}
  .desc-line.editing{background:var(--pill);}
  .desc-add{display:flex;align-items:center;gap:6px;padding:3px 4px;border-radius:6px;color:var(--sub);font-size:13px;cursor:pointer;border:1px dashed transparent;margin-top:2px;user-select:none;}
  .desc-add:hover{border-color:var(--line);background:var(--pill);}
  .desc-line .del-btn{opacity:0;border:none;background:none;color:var(--sub);font-size:16px;cursor:pointer;padding:0 2px;line-height:1;flex:0 0 auto;}
  .desc-line:hover .del-btn{opacity:1;}

  .tabs{display:flex;gap:26px;border-bottom:1px solid var(--line);margin-top:18px;overflow-x:auto;}
  .tabs span{padding:14px 2px;font-size:14px;font-weight:500;color:var(--sub);white-space:nowrap;}
  .tabs span:first-child{color:var(--text);border-bottom:2px solid var(--text);}

  .footer-note{padding:22px 4px 40px;color:var(--sub);font-size:12.5px;line-height:1.6;}
  .footer-note button{margin-top:8px;border:1px solid var(--line);background:transparent;color:var(--text);border-radius:8px;padding:6px 12px;font-size:12.5px;cursor:pointer;margin-right:6px;}
  input[type=file]{display:none;}

  /* export bar */
  .export-bar{position:fixed;bottom:24px;right:24px;z-index:999;display:flex;flex-direction:column;align-items:flex-end;gap:8px;}
  #exportBtn{display:flex;align-items:center;gap:8px;background:#065fd4;color:#fff;border:none;border-radius:20px;padding:10px 20px;font-size:14px;font-weight:600;cursor:pointer;box-shadow:0 2px 12px rgba(0,0,0,.22);transition:background .15s,transform .1s;font-family:inherit;}
  #exportBtn:hover{background:#0556c0;transform:translateY(-1px);}
  #exportBtn:active{transform:translateY(0);}
  #exportBtn:disabled{background:#aaa;cursor:wait;transform:none;}
  #exportStatus{background:rgba(0,0,0,.72);color:#fff;font-size:12px;padding:5px 12px;border-radius:12px;display:none;white-space:nowrap;}
</style>
</head>
<body>

<div class="topbar">
  <div class="searchbox"><input value="검색" readonly><button>🔍</button></div>
  <div class="spacer"></div>
  <button class="pill-btn">+ 만들기</button>
  <span style="font-size:18px;">🔔</span>
</div>

<label class="banner-wrap" id="bannerWrap" for="bannerInput">
  <img id="bannerImg" alt="">
  <div class="banner-empty">
    <span class="icon">🖼️</span>
    <span>배너 이미지 업로드</span>
    <small>권장 2560 × 1440px · 원본 비율 그대로 표시됩니다</small>
  </div>
  <div class="banner-overlay"><span>배너 변경</span><small>2560 × 1440px 권장</small></div>
</label>
<input type="file" id="bannerInput" accept="image/*">

<div class="content">
  <div class="channel-head">
    <label class="avatar-wrap" for="avatarInput">
      <img id="avatarImg" alt="">
      <div class="avatar-placeholder">프로필 사진<br>업로드</div>
      <div class="avatar-hint">변경</div>
    </label>
    <input type="file" id="avatarInput" accept="image/*">

    <div class="meta">
      <div class="name-row">
        <input class="name-input" id="channelName" value="채널 이름" maxlength="40">
        <svg class="verify" viewBox="0 0 24 24" fill="currentColor"><path d="M23 12l-2.44-2.78.34-3.68-3.61-.82-1.89-3.18L12 2.96 8.6 1.54 6.71 4.72l-3.61.81.34 3.68L1 12l2.44 2.78-.34 3.69 3.61.82 1.89 3.18L12 21.04l3.4 1.42 1.89-3.18 3.61-.82-.34-3.68L23 12zm-12.91 4.72l-3.8-3.81 1.48-1.48 2.32 2.32 5.85-5.87 1.48 1.48-7.33 7.36z"/></svg>
      </div>
      <div class="subline">
        <span>@</span><input class="handle-input" id="handleInput" value="handle" maxlength="30">
        <span class="dot">·</span>
        <span>구독자 <input class="subs-input" id="subsInput" value="0명"></span>
        <span class="dot">·</span>
        <span>동영상 0개</span>
      </div>
      <div class="desc-block" id="descBlock"></div>
      <div class="desc-add" id="descAdd">＋ 설명 추가</div>
    </div>
  </div>

  <div class="tabs">
    <span>홈</span><span>동영상</span><span>Shorts</span><span>라이브</span><span>재생목록</span><span>게시물</span><span>정보</span>
  </div>

  <div class="footer-note">
    실제 채널이 아닌 가상의 목업 편집기입니다. 모든 데이터는 브라우저에만 저장되며 서버로 전송되지 않습니다.<br>
    <button id="resetBtn">초기화</button>
  </div>
</div>

<div class="export-bar">
  <div id="exportStatus"></div>
  <button id="exportBtn">📷 PNG로 저장</button>
</div>

<script>
(function(){
  const $ = id => document.getElementById(id);
  const KEY = 'yt-editor-v2';

  function load(){ try{ return JSON.parse(localStorage.getItem(KEY)||'{}'); }catch(e){ return {}; } }
  function save(patch){ try{ localStorage.setItem(KEY, JSON.stringify(Object.assign(load(), patch))); }catch(e){} }
  function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function renderLine(text){ return esc(text).replace(/(#[^\s#<&]+)/g,'<span class="tag">$1</span>'); }

  let lines = [];
  let bannerDataUrl = null;
  let avatarDataUrl = null;

  function buildLineEl(text, idx){
    const row = document.createElement('div');
    row.className = 'desc-line';
    const span = document.createElement('span');
    span.className = 'line-text';
    span.innerHTML = renderLine(text);
    const inp = document.createElement('input');
    inp.className = 'line-input';
    inp.value = text;
    inp.maxLength = 200;
    const del = document.createElement('button');
    del.className = 'del-btn';
    del.title = '삭제';
    del.textContent = '×';
    row.appendChild(span); row.appendChild(inp); row.appendChild(del);
    row.addEventListener('click', function(e){
      if(e.target===del) return;
      if(row.classList.contains('editing')) return;
      row.classList.add('editing'); inp.focus(); inp.select();
    });
    inp.addEventListener('input', function(){ lines[idx]=inp.value; span.innerHTML=renderLine(inp.value); save({desc:lines}); });
    inp.addEventListener('blur', function(){ row.classList.remove('editing'); });
    inp.addEventListener('keydown', function(e){ if(e.key==='Enter'||e.key==='Escape') inp.blur(); });
    del.addEventListener('click', function(){ lines.splice(idx,1); save({desc:lines}); renderDesc(); });
    return row;
  }

  function renderDesc(){
    const block = $('descBlock'); block.innerHTML='';
    lines.forEach(function(t,i){ block.appendChild(buildLineEl(t,i)); });
  }

  $('descAdd').addEventListener('click', function(){
    lines.push(''); save({desc:lines}); renderDesc();
    const rows = $('descBlock').querySelectorAll('.desc-line');
    const last = rows[rows.length-1];
    if(last){ last.classList.add('editing'); last.querySelector('.line-input').focus(); }
  });

  function imgUpload(inputId, imgId, storeKey, onLoad){
    $(inputId).addEventListener('change', function(){
      const file = this.files && this.files[0]; if(!file) return;
      const r = new FileReader();
      r.onload = function(e){
        const url = e.target.result;
        $(imgId).src = url; $(imgId).classList.add('has-img');
        save({[storeKey]: url});
        if(onLoad) onLoad(url);
      };
      r.readAsDataURL(file);
    });
  }

  imgUpload('bannerInput','bannerImg','banner', function(url){
    bannerDataUrl = url; $('bannerWrap').classList.add('has-banner');
  });
  imgUpload('avatarInput','avatarImg','avatar', function(url){ avatarDataUrl = url; });

  $('channelName').addEventListener('input', function(){ save({name:this.value}); });
  $('handleInput').addEventListener('input', function(){ save({handle:this.value}); });
  $('subsInput').addEventListener('input', function(){ save({subs:this.value}); });

  $('resetBtn').addEventListener('click', function(){
    try{ localStorage.removeItem(KEY); }catch(e){} location.reload();
  });

  const s = load();
  if(s.banner){ bannerDataUrl=s.banner; $('bannerImg').src=s.banner; $('bannerImg').classList.add('has-img'); $('bannerWrap').classList.add('has-banner'); }
  if(s.avatar){ avatarDataUrl=s.avatar; $('avatarImg').src=s.avatar; $('avatarImg').classList.add('has-img'); }
  if(s.name) $('channelName').value = s.name;
  if(s.handle) $('handleInput').value = s.handle;
  if(s.subs) $('subsInput').value = s.subs;
  if(Array.isArray(s.desc)) lines = s.desc;
  renderDesc();

  /* ──────────────────────────────────────────
     PNG export: Canvas API로 직접 그리기
     출력 해상도: 1920px 기준 고정 레이아웃
  ────────────────────────────────────────── */
  $('exportBtn').addEventListener('click', async function(){
    const btn = $('exportBtn');
    const status = $('exportStatus');
    btn.disabled = true; btn.textContent = '⏳ 생성 중…';
    status.style.display = 'block'; status.textContent = '이미지를 그리는 중…';

    try {
      // ── 설정값 ──
      const W = 1920;
      const BANNER_H = Math.round(W * 423 / 2560);   // 실제 유튜브 배너 비율
      const TOPBAR_H = 56;
      const PAD_X = Math.round(W * 24 / 1400);        // content padding 비례
      const AVATAR_D = 138;
      const META_X = PAD_X + AVATAR_D + 24;
      const META_Y = TOPBAR_H + BANNER_H + 20;

      // 설명 줄 목록
      const descLines = lines.slice();
      const DESC_LINE_H = 22;
      const META_H = 4 + 42 + 26 + (descLines.length * DESC_LINE_H) + 40; // name+subline+desc+tab-gap
      const TABS_Y = META_Y + META_H;
      const TABS_H = 52;
      const TOTAL_H = TABS_Y + TABS_H + 2;

      const canvas = document.createElement('canvas');
      canvas.width = W; canvas.height = TOTAL_H;
      const ctx = canvas.getContext('2d');

      // 배경
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, W, TOTAL_H);

      // ── 탑바 ──
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, W, TOPBAR_H);
      ctx.strokeStyle = '#e5e5e5'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(0, TOPBAR_H); ctx.lineTo(W, TOPBAR_H); ctx.stroke();
      // 검색박스
      const SBW = 480, SBH = 36, SBX = W/2 - SBW/2, SBY = (TOPBAR_H - SBH)/2;
      ctx.strokeStyle = '#e5e5e5'; ctx.lineWidth = 1;
      roundRect(ctx, SBX, SBY, SBW, SBH, 18);
      ctx.stroke();
      ctx.fillStyle = '#606060'; ctx.font = '14px "Noto Sans KR",Arial,sans-serif';
      ctx.fillText('검색', SBX + 14, SBY + SBH/2 + 5);
      // 만들기 버튼
      const MKBW = 80, MKBH = 32;
      const MKX = W - MKBW - 40, MKY = (TOPBAR_H - MKBH)/2;
      ctx.strokeStyle = '#e5e5e5'; roundRect(ctx, MKX, MKY, MKBW, MKBH, 16); ctx.stroke();
      ctx.fillStyle = '#0f0f0f'; ctx.font = '13px "Noto Sans KR",Arial,sans-serif';
      ctx.fillText('+ 만들기', MKX + 10, MKY + MKBH/2 + 5);

      // ── 배너 ──
      const BANNER_Y = TOPBAR_H;
      if(bannerDataUrl){
        const bImg = await loadImg(bannerDataUrl);
        // 배너: 유튜브처럼 가로폭 전체, 위아래 중앙 크롭
        const bAspect = bImg.width / bImg.height;
        const canvasAspect = W / BANNER_H;
        let sx=0,sy=0,sw=bImg.width,sh=bImg.height;
        if(bAspect > canvasAspect){
          // 원본이 더 넓음 → 좌우 크롭
          sh = bImg.height;
          sw = Math.round(bImg.height * canvasAspect);
          sx = Math.round((bImg.width - sw) / 2);
        } else {
          // 원본이 더 높음 → 위아래 크롭
          sw = bImg.width;
          sh = Math.round(bImg.width / canvasAspect);
          sy = Math.round((bImg.height - sh) / 2);
        }
        ctx.drawImage(bImg, sx, sy, sw, sh, 0, BANNER_Y, W, BANNER_H);
      } else {
        ctx.fillStyle = '#f2f2f2';
        ctx.fillRect(0, BANNER_Y, W, BANNER_H);
      }
      // 배너 하단 선
      ctx.strokeStyle = '#e5e5e5'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(0, BANNER_Y+BANNER_H); ctx.lineTo(W, BANNER_Y+BANNER_H); ctx.stroke();

      // ── 아바타 ──
      const AV_X = PAD_X + AVATAR_D/2;
      const AV_Y = TOPBAR_H + BANNER_H + 20 + AVATAR_D/2;
      ctx.save();
      ctx.beginPath();
      ctx.arc(AV_X, AV_Y, AVATAR_D/2, 0, Math.PI*2);
      ctx.clip();
      if(avatarDataUrl){
        const aImg = await loadImg(avatarDataUrl);
        ctx.drawImage(aImg, AV_X - AVATAR_D/2, AV_Y - AVATAR_D/2, AVATAR_D, AVATAR_D);
      } else {
        ctx.fillStyle = '#f2f2f2';
        ctx.fillRect(AV_X - AVATAR_D/2, AV_Y - AVATAR_D/2, AVATAR_D, AVATAR_D);
      }
      ctx.restore();
      // 아바타 테두리
      ctx.strokeStyle = '#e5e5e5'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.arc(AV_X, AV_Y, AVATAR_D/2, 0, Math.PI*2); ctx.stroke();

      // ── 채널명 ──
      const channelName = $('channelName').value || '채널 이름';
      ctx.fillStyle = '#0f0f0f';
      ctx.font = 'bold 28px "Noto Sans KR",Arial,sans-serif';
      ctx.fillText(channelName, META_X, META_Y + 32);

      // 인증 뱃지 (체크 아이콘 간단 표현)
      const nameW = ctx.measureText(channelName).width;
      const BADGE_X = META_X + nameW + 8;
      const BADGE_Y = META_Y + 18;
      ctx.fillStyle = '#606060';
      ctx.beginPath();
      ctx.arc(BADGE_X + 9, BADGE_Y + 9, 9, 0, Math.PI*2);
      ctx.fill();
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.8;
      ctx.beginPath();
      ctx.moveTo(BADGE_X+5, BADGE_Y+9); ctx.lineTo(BADGE_X+8, BADGE_Y+13); ctx.lineTo(BADGE_X+14, BADGE_Y+6);
      ctx.stroke();

      // ── subline ──
      const handle = $('handleInput').value || 'handle';
      const subs = $('subsInput').value || '0명';
      const subText = `@${handle}  ·  구독자 ${subs}  ·  동영상 0개`;
      ctx.fillStyle = '#606060';
      ctx.font = '14px "Noto Sans KR",Arial,sans-serif';
      ctx.fillText(subText, META_X, META_Y + 32 + 26);

      // ── 설명 줄 ──
      let descY = META_Y + 32 + 26 + 22;
      lines.forEach(function(text){
        // 해시태그 파란색, 나머지 검정
        drawMixedText(ctx, text, META_X, descY, '#0f0f0f', '#065fd4', '14px "Noto Sans KR",Arial,sans-serif');
        descY += DESC_LINE_H;
      });

      // ── 탭 ──
      const tabLabels = ['홈','동영상','Shorts','라이브','재생목록','게시물','정보'];
      ctx.strokeStyle = '#e5e5e5'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(0, TABS_Y+TABS_H); ctx.lineTo(W, TABS_Y+TABS_H); ctx.stroke();
      let tabX = PAD_X;
      tabLabels.forEach(function(label, i){
        ctx.font = '500 14px "Noto Sans KR",Arial,sans-serif';
        const tw = ctx.measureText(label).width;
        ctx.fillStyle = i===0 ? '#0f0f0f' : '#606060';
        ctx.fillText(label, tabX, TABS_Y + 32);
        if(i===0){
          ctx.fillStyle = '#0f0f0f';
          ctx.fillRect(tabX, TABS_Y + TABS_H - 2, tw, 2);
        }
        tabX += tw + 26;
      });

      // ── 다운로드 ──
      const link = document.createElement('a');
      const fname = (channelName).replace(/\s+/g,'_') + '_channel.png';
      link.download = fname;
      link.href = canvas.toDataURL('image/png');
      link.click();

      status.textContent = '✅ 저장 완료!';
      setTimeout(function(){ status.style.display='none'; }, 2500);
    } catch(err){
      console.error(err);
      status.textContent = '❌ 오류: ' + err.message;
      setTimeout(function(){ status.style.display='none'; }, 4000);
    }

    btn.disabled = false; btn.textContent = '📷 PNG로 저장';
  });

  /* helpers */
  function loadImg(src){
    return new Promise(function(res, rej){
      const img = new Image();
      img.onload = function(){ res(img); };
      img.onerror = rej;
      img.src = src;
    });
  }

  function roundRect(ctx, x, y, w, h, r){
    ctx.beginPath();
    ctx.moveTo(x+r, y);
    ctx.lineTo(x+w-r, y); ctx.arcTo(x+w, y, x+w, y+r, r);
    ctx.lineTo(x+w, y+h-r); ctx.arcTo(x+w, y+h, x+w-r, y+h, r);
    ctx.lineTo(x+r, y+h); ctx.arcTo(x, y+h, x, y+h-r, r);
    ctx.lineTo(x, y+r); ctx.arcTo(x, y, x+r, y, r);
    ctx.closePath();
  }

  function drawMixedText(ctx, text, x, y, defaultColor, tagColor, font){
    ctx.font = font;
    const parts = text.split(/(#[^\s#]+)/g);
    let cx = x;
    parts.forEach(function(part){
      const isTag = /^#[^\s#]+$/.test(part);
      ctx.fillStyle = isTag ? tagColor : defaultColor;
      if(isTag) ctx.font = 'bold ' + font;
      else ctx.font = font;
      ctx.fillText(part, cx, y);
      cx += ctx.measureText(part).width;
    });
  }

})();
</script>
